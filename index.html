<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Reofuel Solutions - Customer Management</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f7f8;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .app{max-width:720px;margin:auto;padding:18px}
  header{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
  h1{font-size:23px;margin:0 0 5px}
  .sub{color:#666;font-size:14px}
  .card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
  label{display:block;font-size:14px;font-weight:600;margin:11px 0 6px}
  input,select,button{font:inherit}
  input,select{width:100%;padding:12px;border:1px solid #d8d8dc;border-radius:11px;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;align-items:center;gap:9px;margin-top:13px}
  .check input{width:auto}
  .hidden{display:none}
  button{border:0;border-radius:11px;padding:12px 15px;cursor:pointer}
  .primary{background:#222;color:#fff;width:100%;margin-top:15px}
  .secondary{background:#eee;margin-right:7px;margin-top:8px}
  .danger{background:#ffe8e8;color:#b00020}
  .customer{border:1px solid #e1e1e5;border-radius:13px;padding:13px;margin-top:10px}
  .customer strong{font-size:16px}
  .meta{color:#666;font-size:13px;line-height:1.6;margin-top:4px}
  .status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;margin-top:7px}
  .given{background:#e7f7ed;color:#18733b}
  .pending{background:#fff1d6;color:#8a5700}
  .topbuttons{display:flex;flex-wrap:wrap;gap:7px}
  .empty{color:#777;text-align:center;padding:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Reofuel Solutions</h1>
  <div class="sub">Customer & Container Management</div>
</header>

<div class="card">
  <h2 style="margin:0 0 5px;font-size:19px">Add Customer</h2>

  <label>Customer / Shop Name</label>
  <input id="name" placeholder="Enter customer name">

  <label>Contact Number</label>
  <input id="phone" type="tel" placeholder="Enter contact number">

  <label>Location</label>
  <input id="location" placeholder="Enter location">

  <div class="row">
    <div>
      <label>Rate per KG</label>
      <input id="rate" type="number" step="0.01" placeholder="0">
    </div>
    <div>
      <label>Expected Quantity (KG)</label>
      <input id="qty" type="number" step="0.01" placeholder="0">
    </div>
  </div>

  <label class="check">
    <input id="containerNeeded" type="checkbox" onchange="toggleContainer()">
    Container required?
  </label>

  <div id="containerBox" class="hidden">
    <label>Container Size</label>
    <input id="containerSize" placeholder="Example: 20L / 50L / 100L">

    <label class="check">
      <input id="containerGiven" type="checkbox">
      Container given
    </label>
  </div>

  <button class="primary" onclick="saveCustomer()">Save Customer</button>
</div>

<div class="card">
  <h2 style="margin:0 0 5px;font-size:19px">Container Pending</h2>
  <div id="pendingList"></div>
</div>

<div class="card">
  <h2 style="margin:0 0 5px;font-size:19px">All Customers</h2>
  <div class="topbuttons">
    <button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button class="secondary" onclick="backupJSON()">Backup Data</button>
    <button class="secondary danger" onclick="clearAll()">Delete All</button>
  </div>
  <div id="customerList"></div>
</div>
</div>

<script>
let customers = JSON.parse(localStorage.getItem("reofuel_customers") || "[]");

function toggleContainer(){
  document.getElementById("containerBox").classList.toggle(
    "hidden", !document.getElementById("containerNeeded").checked
  );
}

function save(){
  localStorage.setItem("reofuel_customers", JSON.stringify(customers));
  render();
}

function saveCustomer(){
  const name = document.getElementById("name").value.trim();
  if(!name){ alert("Please enter customer name."); return; }

  const needed = document.getElementById("containerNeeded").checked;
  const size = document.getElementById("containerSize").value.trim();
  if(needed && !size){ alert("Please enter container size."); return; }

  customers.push({
    id: Date.now(),
    name,
    phone: document.getElementById("phone").value.trim(),
    location: document.getElementById("location").value.trim(),
    rate: document.getElementById("rate").value,
    qty: document.getElementById("qty").value,
    containerNeeded: needed,
    containerSize: size,
    containerGiven: needed ? document.getElementById("containerGiven").checked : false,
    created: new Date().toLocaleString()
  });

  save();

  ["name","phone","location","rate","qty","containerSize"].forEach(id=>{
    document.getElementById(id).value="";
  });
  document.getElementById("containerNeeded").checked=false;
  document.getElementById("containerGiven").checked=false;
  toggleContainer();
  alert("Customer saved.");
}

function markContainer(id){
  const c=customers.find(x=>x.id===id);
  if(c){c.containerGiven=true;save();}
}

function deleteCustomer(id){
  customers=customers.filter(x=>x.id!==id);
  save();
}

function render(){
  const list=document.getElementById("customerList");
  const pending=document.getElementById("pendingList");

  if(!customers.length){
    list.innerHTML='<div class="empty">No customers saved yet.</div>';
    pending.innerHTML='<div class="empty">No pending containers.</div>';
    return;
  }

  list.innerHTML=customers.slice().reverse().map(c=>`
    <div class="customer">
      <strong>${esc(c.name)}</strong>
      <div class="meta">
        ${c.phone?esc(c.phone)+"<br>":""}
        ${c.location?esc(c.location)+"<br>":""}
        Rate: ${esc(c.rate||"0")} / KG &nbsp; | &nbsp; Qty: ${esc(c.qty||"0")} KG
      </div>
      ${c.containerNeeded
        ? `<span class="status ${c.containerGiven?'given':'pending'}">
             Container ${c.containerGiven?'Given':'Pending'} — ${esc(c.containerSize)}
           </span>`
        : ""}
      <div style="margin-top:9px">
        ${c.containerNeeded && !c.containerGiven
          ? `<button class="secondary" onclick="markContainer(${c.id})">Mark Container Given</button>` : ""}
        <button class="secondary danger" onclick="deleteCustomer(${c.id})">Delete</button>
      </div>
    </div>
  `).join("");

  const p=customers.filter(c=>c.containerNeeded && !c.containerGiven);
  pending.innerHTML=p.length ? p.map(c=>`
    <div class="customer">
      <strong>${esc(c.name)}</strong>
      <div class="meta">${esc(c.location||"")}<br>Container: ${esc(c.containerSize)}</div>
      <button class="secondary" onclick="markContainer(${c.id})">Mark Given</button>
    </div>
  `).join("") : '<div class="empty">No pending containers.</div>';
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function exportCSV(){
  const head=["Customer","Phone","Location","Rate/KG","Expected KG","Container Required","Container Size","Container Given","Created"];
  const rows=customers.map(c=>[
    c.name,c.phone,c.location,c.rate,c.qty,c.containerNeeded?"Yes":"No",
    c.containerSize,c.containerGiven?"Yes":"No",c.created
  ]);
  const csv=[head,...rows].map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  download(new Blob([csv],{type:"text/csv"}),"reofuel-customers.csv");
}

function backupJSON(){
  download(new Blob([JSON.stringify(customers,null,2)],{type:"application/json"}),"reofuel-backup.json");
}

function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function clearAll(){
  if(confirm("Delete all customer data from this phone?")){
    customers=[]; save();
  }
}

render();
</script>
</body>
</html>
